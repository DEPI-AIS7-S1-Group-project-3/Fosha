name: RAG evaluation

# Builds the real Chroma index and fails if retrieval quality drops (quality gate in rag/eval.py).
# Slow (downloads the embedding model), so it runs only when retrieval code or data changes,
# or when started by hand from the Actions tab.
on:
  pull_request:
    paths:
      - "rag/**"
      - "data/raw_attractions.json"
  workflow_dispatch:

jobs:
  rag-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --python 3.12
      - name: Cache the embedding model (about 1 GB)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-paraphrase-multilingual-mpnet-base-v2
      - name: Build the index
        run: uv run python -m rag.ingest
      - name: Evaluate retrieval
        # Baseline (paraphrase-multilingual-mpnet-base-v2, normalised): headline Hit@3 100%,
        # MRR@5 0.984; Arabic Hit@3 64.3% on the 28-case Arabic slice. Gates leave room for noise.
        run: uv run python -m rag.eval --json eval-report.json --min-hit3 0.90 --min-mrr 0.90 --min-arabic-hit3 0.55
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-report
          path: eval-report.json
          if-no-files-found: ignore
