<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fosha Insights</title>
  <meta name="description" content="Usage analytics for the Fosha travel assistant.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23ffe600'/%3E%3Ccircle cx='32' cy='34' r='22' fill='%23007fff'/%3E%3Crect x='22' y='30' width='5' height='14' fill='%23fff'/%3E%3Crect x='30' y='24' width='5' height='20' fill='%23fff'/%3E%3Crect x='38' y='34' width='5' height='10' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Changa+One&family=Lalezar&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="/dashboard" aria-label="Fosha Insights">
      <span class="wordmark-main" data-i18n="brand"></span>
      <span class="wordmark-dot" aria-hidden="true"></span>
      <span class="wordmark-alt" data-i18n="dash_title"></span>
    </a>
    <nav class="nav" aria-label="Time range">
      <button type="button" class="text-btn" data-range="7" data-i18n="r7"></button>
      <button type="button" class="text-btn" data-range="30" data-i18n="r30"></button>
      <button type="button" class="text-btn" data-range="0" data-i18n="rall"></button>
    </nav>
    <div class="tools">
      <button type="button" class="text-btn" id="refresh" data-i18n="refresh"></button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" class="text-btn" data-lang="en">EN</button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" class="text-btn" data-lang="ar">ع</button>
    </div>
  </header>

  <main class="dash" id="dash"></main>

  <script src="/static/i18n.js"></script>
  <script src="/static/dashboard.js"></script>
</body>
</html>
