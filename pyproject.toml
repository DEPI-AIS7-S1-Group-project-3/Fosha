[project]
name = "rehlaguide"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "amrkhaled100", email = "amrkhalednoser327@example.com" }
]
requires-python = ">=3.10, <3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.115.0",
    "fastembed>=0.8.1",
    "google-genai>=2.31.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.3",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=6.1.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
rehlaguide = "rehlaguide:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[project.optional-dependencies]
# Experiment tracking for `python -m rag.eval --mlflow` (not needed to run the app)
tracking = [
    "mlflow>=2.14",
    "scipy<1.18",
]
# Request tracing with a self-hosted Langfuse (agents/tracing.py). Off unless the LANGFUSE_* keys are set.
# Langfuse needs Python 3.11+, while the project still allows 3.10, hence the marker.
observability = [
    "langfuse>=5,<6; python_version >= '3.11'",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=9.1.1",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
override-dependencies = [
    "numpy<2",
    "onnxruntime<=1.23.2",
]



